name: Build KENEYASO GESTION PRO APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Telecharger le projet
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Ouvrir le projet
        run: |
          rm -rf android-project
          mkdir android-project
          unzip KENEYASO_GESTION_PRO_SOURCE.zip -d android-project

      - name: Construire APK
        run: |
          cd android-project/Keneyaso_Gestion_Pro_Android
          gradle assembleDebug

      - name: Verifier APK
        run: |
          find android-project -type f -name "*.apk" -print

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: KENEYASO-GESTION-PRO-APK
          path: android-project/**/*.apk
          if-no-files-found: error
